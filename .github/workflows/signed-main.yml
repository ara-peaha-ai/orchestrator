name: Signed commits on main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on unsigned commits
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # ponytail: reports after the push, it does not block it
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # new branch: whole history
            rows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits?sha=$AFTER&per_page=100" --jq '.[] | "\(.sha) \(.commit.verification.verified)"')
          else
            rows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER?per_page=100" --jq '.commits[] | "\(.sha) \(.commit.verification.verified)"')
          fi
          unsigned=$(echo "$rows" | awk '$2 != "true" {print $1}')
          for sha in $unsigned; do echo "::error::Unsigned commit on main: $sha"; done
          [ -z "$unsigned" ]
